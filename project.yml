name: ScanAddr
options:
  bundleIdPrefix: com.scanaddr
  deploymentTarget:
    iOS: "15.0"
  createIntermediateGroups: true
  groupSortPosition: top
  generateEmptyDirectories: true
  xcodeVersion: "15.4"
  projectFormat: xcode15_3

settings:
  base:
    SWIFT_VERSION: "5.0"
    SWIFT_STRICT_CONCURRENCY: minimal
    ENABLE_BITCODE: "NO"
    CLANG_ENABLE_MODULES: "YES"
    DEBUG_INFORMATION_FORMAT: dwarf-with-dsym
    CODE_SIGNING_ALLOWED: "NO"
    CODE_SIGNING_REQUIRED: "NO"
    CODE_SIGN_IDENTITY: ""

targets:
  ScanAddr:
    type: application
    platform: iOS
    deploymentTarget: "15.0"
    sources:
      - path: ScanCore
      - path: ScanAddr
        excludes:
          - "Info.plist"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.scanaddr.app
        PRODUCT_NAME: ScanAddr
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        TARGETED_DEVICE_FAMILY: "1,2"
        INFOPLIST_FILE: ScanAddr/Info.plist
        GENERATE_INFOPLIST_FILE: "NO"
        INFOPLIST_KEY_CFBundleDisplayName: scanaddr
        SUPPORTS_MACCATALYST: "NO"
        SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD: "NO"

schemes:
  ScanAddr:
    build:
      targets:
        ScanAddr: all
    run:
      config: Debug
    archive:
      config: Release
